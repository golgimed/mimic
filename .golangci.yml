version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - copyloopvar
    - misspell
  settings:
    misspell:
      # Portuguese API route and payload terms, intentionally kept to match Bry SCAD.
      ignore-rules:
        - participantes
        - protocolos
  exclusions:
    generated: strict

run:
  timeout: 5m
