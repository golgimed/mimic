<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mimic</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex flex-col font-sans text-slate-800">
<header class="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-white">
  <h1 class="text-lg font-semibold">Mimic</h1>
  <div class="flex items-center gap-2">
  <button id="show-simulations" class="text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md px-3 py-1.5 transition-colors">
    Simulations
  </button>
  <button id="show-timeline" class="text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md px-3 py-1.5 transition-colors">
    Timeline
  </button>
  <button id="flush" class="text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-md px-3 py-1.5 transition-colors">
    Flush
  </button>
  </div>
</header>
<div class="flex flex-1 overflow-hidden">
  <div id="list" class="w-2/5 overflow-y-auto border-r border-slate-200 bg-white">
    <table class="w-full text-sm">
      <thead class="sticky top-0 bg-slate-50 text-slate-500 uppercase text-xs">
        <tr>
          <th class="text-left px-3 py-2">Provider</th>
          <th class="text-left px-3 py-2">Type</th>
          <th class="text-left px-3 py-2">Status</th>
          <th class="text-left px-3 py-2">Created</th>
        </tr>
      </thead>
      <tbody id="rows" class="divide-y divide-slate-100"></tbody>
    </table>
    <div id="empty" class="hidden p-4 text-slate-400 text-sm">No items yet.</div>
  </div>
  <div id="detail" class="w-3/5 overflow-y-auto p-4">
    <div class="text-slate-400 text-sm">Select an item to see its detail.</div>
  </div>
</div>

<script>
let selectedKey = null;

async function loadItems() {
  const res = await fetch('/admin/items');
  const { content } = await res.json();
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  rows.innerHTML = '';
  empty.classList.toggle('hidden', content.length > 0);

  for (const item of content) {
    const tr = document.createElement('tr');
    const key = item.provider + ':' + item.id;
    tr.className = 'cursor-pointer hover:bg-slate-50' + (key === selectedKey ? ' bg-blue-50' : '');
    tr.innerHTML = `
      <td class="px-3 py-2"><span class="inline-block px-2 py-0.5 rounded text-xs bg-slate-100 text-slate-600">${item.provider}</span></td>
      <td class="px-3 py-2">${item.type}</td>
      <td class="px-3 py-2">${item.status}</td>
      <td class="px-3 py-2 text-slate-500">${new Date(item.createdAt).toLocaleString()}</td>
    `;
    tr.addEventListener('click', () => selectItem(item.provider, item.id));
    rows.appendChild(tr);
  }
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// renderTimeline renders timeline events as a compact table.
function renderTimeline(events) {
  if (!events.length) return '<div class="text-slate-400 text-xs">(no events)</div>';
  const rows = events.map(e => `
    <tr class="align-top">
      <td class="pr-3 py-1 text-slate-500 whitespace-nowrap">${escapeHTML(new Date(e.ts).toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3, hour12: false}))}</td>
      <td class="pr-3 py-1 font-medium whitespace-nowrap">${escapeHTML(e.type)}</td>
      <td class="pr-3 py-1 text-slate-500 whitespace-nowrap">${escapeHTML([e.provider, e.resourceType, e.resourceId].filter(Boolean).join(' / '))}${e.jobId ? ' job #' + e.jobId : ''}</td>
      <td class="pr-3 py-1 whitespace-nowrap">${e.requestId ? `<a href="#" class="req text-blue-600 hover:underline" data-req="${escapeHTML(e.requestId)}" title="Show everything this request caused">${escapeHTML(e.requestId.slice(0, 8))}</a>` : ''}</td>
      <td class="py-1 text-slate-600 break-all">${e.data ? escapeHTML(JSON.stringify(e.data)) : ''}</td>
    </tr>`).join('');
  return `<table class="w-full text-xs">${rows}</table>`;
}

async function fetchTimeline(query) {
  const res = await fetch('/admin/timeline' + query);
  const { content } = await res.json();
  return content;
}

async function showTimeline(requestId) {
  selectedKey = null;
  const events = await fetchTimeline(requestId ? `?request_id=${encodeURIComponent(requestId)}` : '?limit=200');
  const title = requestId ? `Request ${escapeHTML(requestId)} (${events.length} events)` : `Timeline (latest ${events.length})`;
  document.getElementById('detail').innerHTML = `
    <h2 class="text-base font-semibold mb-3">${title}</h2>
    ${renderTimeline(events)}
  `;
  loadItems();
}

document.getElementById('show-timeline').addEventListener('click', () => showTimeline());

async function showSimulationTimeline(id) {
  const events = await fetchTimeline(`?simulation_id=${encodeURIComponent(id)}`);
  document.getElementById('detail').innerHTML = `
    <h2 class="text-base font-semibold mb-3">Simulation ${escapeHTML(id)} (${events.length} events)</h2>
    ${renderTimeline(events)}
  `;
}

async function showSimulations() {
  selectedKey = null;
  const [simsRes, scenariosRes, profilesRes] = await Promise.all([
    fetch('/admin/simulations'), fetch('/admin/scenarios'), fetch('/admin/profiles'),
  ]);
  const { content } = await simsRes.json();
  const scenarios = (await scenariosRes.json()).content;
  const profiles = (await profilesRes.json()).content;
  const rows = content.map(s => `
    <tr class="align-top border-t border-slate-100">
      <td class="pr-3 py-1.5 font-mono">${escapeHTML(s.id.slice(0, 12))}</td>
      <td class="pr-3 py-1.5">${escapeHTML(s.seed)}</td>
      <td class="pr-3 py-1.5">${escapeHTML(s.scenario || '—')}</td>
      <td class="pr-3 py-1.5">${escapeHTML(s.profile || '—')}</td>
      <td class="pr-3 py-1.5 text-slate-500">${s.replayedFrom ? 'replay of ' + escapeHTML(s.replayedFrom.slice(0, 12)) : ''}</td>
      <td class="py-1.5 whitespace-nowrap">
        <button class="sim-timeline text-blue-600 hover:underline mr-2" data-id="${escapeHTML(s.id)}">Timeline</button>
        <button class="sim-replay text-blue-600 hover:underline" data-id="${escapeHTML(s.id)}">Replay</button>
      </td>
    </tr>`).join('');
  const scenarioOptions = scenarios.map(s =>
    `<option value="${escapeHTML(s.name)}" title="${escapeHTML(s.description)}">${escapeHTML(s.provider)} · ${escapeHTML(s.name)}</option>`).join('');
  const profileOptions = profiles.map(p =>
    `<option value="${escapeHTML(p.name)}" title="${escapeHTML(p.description)}">${escapeHTML(p.name)}</option>`).join('');
  document.getElementById('detail').innerHTML = `
    <form id="new-sim" class="flex flex-wrap items-end gap-2 mb-4 text-xs">
      <label class="flex flex-col">Scenario<select name="scenario" class="border rounded px-1 py-0.5"><option value="">(provider default)</option>${scenarioOptions}</select></label>
      <label class="flex flex-col">Profile<select name="profile" class="border rounded px-1 py-0.5"><option value="">(default)</option>${profileOptions}</select></label>
      <label class="flex flex-col">Seed<input name="seed" type="number" min="1" placeholder="random" class="border rounded px-1 py-0.5 w-28"></label>
      <button class="font-medium text-white bg-slate-700 hover:bg-slate-800 rounded-md px-3 py-1">New simulation</button>
    </form>
    <h2 class="text-base font-semibold mb-1">Simulations (${content.length})</h2>
    <p class="text-xs text-slate-500 mb-3">Replay re-sends a simulation's recorded requests in a <em>new</em> simulation with the same seed, scenario and profile. The original is not modified.</p>
    ${content.length ? `<table class="w-full text-xs"><tr class="text-slate-500 text-left"><th>ID</th><th>Seed</th><th>Scenario</th><th>Profile</th><th></th><th></th></tr>${rows}</table>` : '<div class="text-slate-400 text-xs">No explicit simulations yet (POST /admin/simulations).</div>'}
  `;
  loadItems();
}

async function replaySimulation(id) {
  const res = await fetch(`/admin/simulations/${encodeURIComponent(id)}/replay`, { method: 'POST' });
  const r = await res.json();
  if (!res.ok) { alert(r.error ? r.error.message : 'Replay failed'); return; }
  const rows = r.requests.map(q => `
    <tr class="border-t border-slate-100 ${q.match ? '' : 'bg-amber-50'}">
      <td class="pr-3 py-1">${q.seq}</td><td class="pr-3 py-1">${escapeHTML(q.method)} ${escapeHTML(q.path)}</td>
      <td class="pr-3 py-1">${q.originalStatus}</td><td class="pr-3 py-1">${q.replayStatus}</td><td class="py-1">${q.match ? '✓' : '≠'}</td>
    </tr>`).join('');
  document.getElementById('detail').innerHTML = `
    <h2 class="text-base font-semibold mb-1">Replay of ${escapeHTML(id)}</h2>
    <p class="text-xs text-slate-500 mb-1">New simulation <a href="#" class="sim-link text-blue-600 hover:underline" data-id="${escapeHTML(r.simulation.id)}">${escapeHTML(r.simulation.id)}</a> · ${r.matched}/${r.total} statuses matched</p>
    <p class="text-xs text-slate-500 mb-3">${escapeHTML(r.timing)}</p>
    <table class="w-full text-xs"><tr class="text-slate-500 text-left"><th>#</th><th>Request</th><th>Original</th><th>Replay</th><th></th></tr>${rows}</table>
  `;
}

document.getElementById('show-simulations').addEventListener('click', showSimulations);

document.getElementById('detail').addEventListener('submit', async e => {
  if (e.target.id !== 'new-sim') return;
  e.preventDefault();
  const f = new FormData(e.target);
  const body = {};
  if (f.get('scenario')) body.scenario = f.get('scenario');
  if (f.get('profile')) body.profile = f.get('profile');
  if (f.get('seed')) body.seed = Number(f.get('seed'));
  const res = await fetch('/admin/simulations', { method: 'POST', body: JSON.stringify(body) });
  if (!res.ok) { const r = await res.json(); alert(JSON.stringify(r.error)); return; }
  const s = await res.json();
  await showSimulations();
  prompt('Simulation created. Send requests with this header:', 'X-Mimic-Simulation: ' + s.id);
});

// Clicking a request ID in any timeline shows everything that request
// caused; simulation rows offer their timeline and a replay.
document.getElementById('detail').addEventListener('click', e => {
  const link = e.target.closest('a.req');
  if (link) { e.preventDefault(); showTimeline(link.dataset.req); return; }
  const simTimeline = e.target.closest('.sim-timeline, a.sim-link');
  if (simTimeline) { e.preventDefault(); showSimulationTimeline(simTimeline.dataset.id); return; }
  const replay = e.target.closest('.sim-replay');
  if (replay) replaySimulation(replay.dataset.id);
});

async function selectItem(provider, id) {
  selectedKey = provider + ':' + id;
  const res = await fetch(`/admin/items/${provider}/${id}`);
  const detail = await res.json();
  const events = await fetchTimeline(`?provider=${encodeURIComponent(provider)}&resource_id=${encodeURIComponent(id)}`);
  const el = document.getElementById('detail');
  el.innerHTML = `
    <h2 class="text-base font-semibold mb-3">${provider} / ${id}</h2>
    <h3 class="text-sm font-medium text-slate-500 mb-1">Payload</h3>
    <pre class="bg-slate-50 rounded-md p-3 text-xs overflow-x-auto whitespace-pre-wrap break-words mb-4">${JSON.stringify(detail.payload, null, 2)}</pre>
    <h3 class="text-sm font-medium text-slate-500 mb-1">Webhook Deliveries (${detail.webhookDeliveries.length})</h3>
    <pre class="bg-slate-50 rounded-md p-3 text-xs overflow-x-auto whitespace-pre-wrap break-words mb-4">${detail.webhookDeliveries.length ? JSON.stringify(detail.webhookDeliveries, null, 2) : '(none)'}</pre>
    <h3 class="text-sm font-medium text-slate-500 mb-1">Timeline (${events.length})</h3>
    <div class="bg-slate-50 rounded-md p-3">${renderTimeline(events)}</div>
  `;
  loadItems();
}

document.getElementById('flush').addEventListener('click', async () => {
  if (!confirm('Flush all data? This deletes every item, fault and webhook log.')) return;
  await fetch('/admin/flush', { method: 'POST' });
  selectedKey = null;
  document.getElementById('detail').innerHTML = '<div class="text-slate-400 text-sm">Select an item to see its detail.</div>';
  loadItems();
});

loadItems();
setInterval(loadItems, 3000);
</script>
</body>
</html>
