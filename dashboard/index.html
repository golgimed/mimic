<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Provider Simulator</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  #list { width: 40%; overflow-y: auto; border-right: 1px solid #ccc; }
  #detail { width: 60%; overflow-y: auto; padding: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
  tr { cursor: pointer; }
  tr:hover { background: #f5f5f5; }
  tr.selected { background: #e0ecff; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #eee; }
  pre { background: #f7f7f7; padding: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  h2 { margin-top: 0; }
  .empty { padding: 16px; color: #888; }
</style>
</head>
<body>
<div id="list">
  <table>
    <thead><tr><th>Provider</th><th>Type</th><th>Status</th><th>Created</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">No items yet.</div>
</div>
<div id="detail"><div class="empty">Select an item to see its detail.</div></div>

<script>
let selectedKey = null;

async function loadItems() {
  const res = await fetch('/admin/items');
  const { content } = await res.json();
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  rows.innerHTML = '';
  empty.style.display = content.length ? 'none' : 'block';

  for (const item of content) {
    const tr = document.createElement('tr');
    const key = item.provider + ':' + item.id;
    if (key === selectedKey) tr.classList.add('selected');
    tr.innerHTML = `<td><span class="badge">${item.provider}</span></td><td>${item.type}</td><td>${item.status}</td><td>${new Date(item.createdAt).toLocaleString()}</td>`;
    tr.addEventListener('click', () => selectItem(item.provider, item.id));
    rows.appendChild(tr);
  }
}

async function selectItem(provider, id) {
  selectedKey = provider + ':' + id;
  const res = await fetch(`/admin/items/${provider}/${id}`);
  const detail = await res.json();
  const el = document.getElementById('detail');
  el.innerHTML = `
    <h2>${provider} / ${id}</h2>
    <h3>Payload</h3>
    <pre>${JSON.stringify(detail.payload, null, 2)}</pre>
    <h3>Webhook Deliveries (${detail.webhookDeliveries.length})</h3>
    <pre>${detail.webhookDeliveries.length ? JSON.stringify(detail.webhookDeliveries, null, 2) : '(none)'}</pre>
  `;
  loadItems();
}

loadItems();
setInterval(loadItems, 3000);
</script>
</body>
</html>
