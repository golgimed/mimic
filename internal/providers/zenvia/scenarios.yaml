# Built-in zenvia scenarios. Select one per simulation:
#   POST /admin/simulations {"scenario": "<name>"}
# Status codes are Zenvia's documented MESSAGE_STATUS codes; a transition
# without "after" uses ZENVIA_STATUS_DELAY_MS.
- name: message-delivered
  resource: message
  description: A message is sent and then delivered to the recipient's device (Mimic's default path, made explicit).
  initial: ACCEPTED
  transitions:
    - to: SENT
    - to: DELIVERED
  webhooks: [MESSAGE_STATUS]

- name: message-not-delivered
  resource: message
  description: A message reaches the provider but can't be delivered to the device; the NOT_DELIVERED event carries a cause.
  initial: ACCEPTED
  transitions:
    - to: SENT
    - to: NOT_DELIVERED
      meta:
        description: The provider was unable to deliver the message
        reason: Unreachable destination
        details: Simulated by Mimic (scenario message-not-delivered)
  webhooks: [MESSAGE_STATUS]

- name: zenvia-unavailable
  description: Zenvia's API is down; every zenvia request in the simulation gets 503 Service Unavailable. Requests outside the simulation are unaffected.
  faults:
    - kind: http_status
      value: "503"

- name: message-rejected
  resource: message
  description: The provider rejects the message before sending it (e.g. an invalid sender); a single REJECTED event with a cause.
  initial: ACCEPTED
  transitions:
    - to: REJECTED
      meta:
        description: The message was rejected by the provider
        reason: Invalid sender
        details: Simulated by Mimic (scenario message-rejected)
  webhooks: [MESSAGE_STATUS]

- name: message-read
  resource: message
  description: A message is sent, delivered and then read by the recipient. READ depends on the channel (e.g. WhatsApp) in the real API.
  initial: ACCEPTED
  transitions:
    - to: SENT
    - to: DELIVERED
    - to: READ
  webhooks: [MESSAGE_STATUS]

- name: webhook-delivery-failed
  description: Messages progress normally, but every MESSAGE_STATUS webhook in the simulation is dropped (never sent); the drops are logged on the message's webhook log and the timeline.
  faults:
    - kind: webhook_dropped
      route: webhook

- name: request-rate-limited
  description: Sending an SMS is rate limited to 2 requests per minute; further sends in that window get 429 with Retry-After.
  faults:
    - kind: rate_limited
      value: 2/1m
      route: /zenvia/channels/sms/messages
